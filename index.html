<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111315">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Tyrkland — Daði & Kata</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg:#0d0f10; --card:#171a1c; --card2:#202427; --text:#f7f4ed;
      --muted:#aaa79f; --accent:#e5b85c; --ok:#8fcf9d; --line:#2c3033;
      --danger:#e58f8f;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    body { padding-bottom:env(safe-area-inset-bottom); }
    main { max-width:760px; margin:auto; padding:16px 14px 100px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    h1 { font-size:25px; margin:3px 0 2px; }
    .sub { color:var(--muted); font-size:13px; }
    .sync { font-size:12px; color:var(--muted); padding-top:8px; text-align:right; }
    .tabs {
      display:flex; gap:7px; overflow-x:auto; padding:15px 0 10px;
      position:sticky; top:0; z-index:4;
      background:linear-gradient(var(--bg) 78%, rgba(13,15,16,0));
      scrollbar-width:none;
    }
    .tabs::-webkit-scrollbar { display:none; }
    .tab {
      white-space:nowrap; border:1px solid var(--line); background:var(--card);
      color:var(--text); padding:9px 12px; border-radius:999px; font-weight:600;
    }
    .tab.active { background:var(--accent); color:#15120b; border-color:var(--accent); }
    .list { display:grid; gap:10px; }
    .item {
      background:var(--card); border:1px solid var(--line);
      border-radius:17px; padding:13px;
    }
    .item.done { opacity:.55; }
    .top { display:flex; align-items:flex-start; gap:10px; }
    .check {
      width:26px; height:26px; border-radius:50%; border:2px solid var(--accent);
      background:none; color:#111; flex:none; font-weight:900;
    }
    .done .check { background:var(--ok); border-color:var(--ok); }
    .title { font-weight:760; font-size:17px; flex:1; line-height:1.2; }
    .meta { color:var(--accent); font-size:12px; margin-top:4px; font-weight:600; }
    .notes { color:#d8d4cc; margin-top:9px; white-space:pre-wrap; line-height:1.4; }
    .actions { display:flex; gap:8px; margin-top:11px; flex-wrap:wrap; }
    .actions button, .actions a {
      border:1px solid var(--line); background:var(--card2); color:var(--text);
      padding:7px 10px; border-radius:10px; text-decoration:none; font-size:13px;
    }
    .actions .danger { color:var(--danger); }
    .fab {
      position:fixed; right:18px; bottom:calc(22px + env(safe-area-inset-bottom));
      width:60px; height:60px; border:0; border-radius:50%;
      font-size:32px; line-height:1; background:var(--accent); color:#17130c;
      box-shadow:0 8px 30px #0009; z-index:10;
    }
    dialog {
      width:min(92vw,560px); border:1px solid var(--line); border-radius:20px;
      background:var(--card); color:var(--text); padding:18px;
    }
    dialog::backdrop { background:#000b; }
    label { display:block; color:var(--muted); font-size:12px; margin:11px 0 5px; }
    input, textarea, select {
      width:100%; background:#0f1112; border:1px solid var(--line);
      color:var(--text); padding:11px; border-radius:11px; font:inherit;
    }
    textarea { min-height:92px; resize:vertical; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }
    .modal-actions button {
      border:1px solid var(--line); background:var(--card2); color:var(--text);
      padding:9px 12px; border-radius:10px;
    }
    .modal-actions .primary { background:var(--accent); color:#15120b; font-weight:800; }
    .empty { color:var(--muted); text-align:center; padding:45px 15px; }
    .offline-note {
      display:none; background:#2a2114; border:1px solid #59451f; color:#e7c98d;
      border-radius:12px; padding:9px 11px; margin:8px 0 0; font-size:12px;
    }
    .offline .offline-note { display:block; }
    button { cursor:pointer; }
    @media(max-width:480px) {
      h1 { font-size:22px; }
      main { padding-top:10px; }
      .row { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<main id="app">
  <header>
    <div>
      <h1>🇹🇷 Tyrkland</h1>
      <div class="sub">Daði & Kata · sameiginlega ferðaborðið</div>
    </div>
    <div class="sync" id="sync">Tengist…</div>
  </header>

  <div class="offline-note">Offline — sýni síðustu vistuðu stöðu. Breytingar þurfa net.</div>

  <nav class="tabs" id="tabs"></nav>
  <section class="list" id="list"></section>
</main>

<button class="fab" id="add" aria-label="Bæta við">+</button>

<dialog id="dlg">
  <form id="form">
    <input type="hidden" id="id">
    <label>Hvað?</label>
    <input id="title" required placeholder="t.d. Westpark Outlet">

    <div class="row">
      <div>
        <label>Flokkur</label>
        <select id="category">
          <option value="plan">Plan</option>
          <option value="staður">Staður</option>
          <option value="innkaup">Innkaup</option>
          <option value="matur">Matur</option>
          <option value="annað">Annað</option>
        </select>
      </div>
      <div>
        <label>Dagsetning</label>
        <input id="date" type="date">
      </div>
    </div>

    <label>Maps / vefslóð</label>
    <input id="maps" type="url" placeholder="https://...">

    <label>Athugasemd</label>
    <textarea id="notes" placeholder="Það sem við viljum muna…"></textarea>

    <div class="modal-actions">
      <button type="button" id="cancel">Hætta við</button>
      <button class="primary" type="submit">Vista</button>
    </div>
  </form>
</dialog>

<script>
const SUPABASE_URL = "https://ecvpkolcusayuakntnlb.supabase.co";
const SUPABASE_KEY = "sb_publishable_EFXmhorucrLfmiWHj0NZMg_YhPIOPYM";
const API = SUPABASE_URL + "/rest/v1/items";
const HEADERS = {
  apikey: SUPABASE_KEY,
  Authorization: "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

let items = [];
let filter = "today";
const $ = id => document.getElementById(id);
const tabs = [
  ["today","Í dag"],
  ["later","Seinna"],
  ["places","Staðir"],
  ["shopping","Innkaup"],
  ["all","Allt"]
];

function isoToday() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
}

function esc(s="") {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function cacheItems() {
  localStorage.setItem("tyrkland_items_cache", JSON.stringify(items));
}

function loadCached() {
  try {
    const x = JSON.parse(localStorage.getItem("tyrkland_items_cache") || "[]");
    if (Array.isArray(x)) items = x;
  } catch {}
}

function renderTabs() {
  $("tabs").innerHTML = tabs.map(([k,n]) =>
    `<button class="tab ${filter===k?"active":""}" data-k="${k}">${n}</button>`
  ).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    filter = b.dataset.k;
    render();
  });
}

function visible(x) {
  const t = isoToday();
  if (filter === "today") return x.planned_date === t;
  if (filter === "later") return !x.done && (!x.planned_date || x.planned_date > t);
  if (filter === "places") return x.category === "staður";
  if (filter === "shopping") return x.category === "innkaup";
  return true;
}

function render() {
  renderTabs();
  const a = items.filter(visible).sort((a,b) =>
    Number(a.done)-Number(b.done) ||
    (a.sort_order||0)-(b.sort_order||0) ||
    a.id-b.id
  );

  $("list").innerHTML = a.length ? a.map(x => `
    <article class="item ${x.done?"done":""}">
      <div class="top">
        <button class="check" onclick="toggleDone(${x.id}, ${!x.done})">${x.done?"✓":""}</button>
        <div class="title">
          ${esc(x.title)}
          <div class="meta">${esc(x.category)}${x.planned_date ? " · " + x.planned_date : ""}</div>
        </div>
      </div>
      ${x.notes ? `<div class="notes">${esc(x.notes)}</div>` : ""}
      <div class="actions">
        ${x.maps_url ? `<a href="${esc(x.maps_url)}" target="_blank" rel="noopener">🗺️ Opna</a>` : ""}
        <button onclick="editItem(${x.id})">Breyta</button>
        <button class="danger" onclick="deleteItem(${x.id})">Eyða</button>
      </div>
    </article>
  `).join("") : `<div class="empty">Ekkert hér enn ✨</div>`;
}

async function load() {
  try {
    const r = await fetch(API + "?select=*&order=sort_order.asc,id.asc", {headers:HEADERS});
    if (!r.ok) throw new Error(await r.text());
    items = await r.json();
    cacheItems();
    $("sync").textContent = "● Samstillt";
    $("app").classList.remove("offline");
    render();
  } catch (e) {
    $("sync").textContent = "Offline";
    $("app").classList.add("offline");
    loadCached();
    render();
    console.error(e);
  }
}

async function patch(id, obj) {
  const r = await fetch(API + "?id=eq." + id, {
    method:"PATCH",
    headers:{...HEADERS, Prefer:"return=minimal"},
    body:JSON.stringify(obj)
  });
  if (!r.ok) alert("Gat ekki vistað breytingu.");
  await load();
}

async function toggleDone(id, done) {
  await patch(id, {done});
}

async function deleteItem(id) {
  if (!confirm("Eyða þessari færslu?")) return;
  const r = await fetch(API + "?id=eq." + id, {
    method:"DELETE",
    headers:HEADERS
  });
  if (!r.ok) alert("Gat ekki eytt.");
  await load();
}

function editItem(id) {
  const x = items.find(i => i.id === id);
  if (!x) return;
  $("id").value = x.id;
  $("title").value = x.title || "";
  $("category").value = x.category || "annað";
  $("date").value = x.planned_date || "";
  $("maps").value = x.maps_url || "";
  $("notes").value = x.notes || "";
  $("dlg").showModal();
}

$("add").onclick = () => {
  $("form").reset();
  $("id").value = "";
  $("date").value = isoToday();
  $("dlg").showModal();
  setTimeout(() => $("title").focus(), 50);
};

$("cancel").onclick = () => $("dlg").close();

$("form").onsubmit = async e => {
  e.preventDefault();
  const obj = {
    title:$("title").value.trim(),
    category:$("category").value,
    planned_date:$("date").value || null,
    maps_url:$("maps").value.trim() || null,
    notes:$("notes").value.trim() || null,
    created_by:"Daði/Kata"
  };
  const id = $("id").value;

  let r;
  if (id) {
    r = await fetch(API + "?id=eq." + id, {
      method:"PATCH",
      headers:{...HEADERS, Prefer:"return=minimal"},
      body:JSON.stringify(obj)
    });
  } else {
    r = await fetch(API, {
      method:"POST",
      headers:{...HEADERS, Prefer:"return=minimal"},
      body:JSON.stringify(obj)
    });
  }
  if (!r.ok) {
    alert("Gat ekki vistað. Athugaðu netsambandið.");
    return;
  }
  $("dlg").close();
  await load();
};

window.addEventListener("online", load);
window.addEventListener("focus", load);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}

load();
setInterval(load, 12000);
</script>
</body>
</html>
